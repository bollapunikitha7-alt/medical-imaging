data:
  batch_size: 2
  color_jitter_strength: 0.0
  crop_scale:
    - 0.3
    - 1.0
  crop_size: 224
  root_path: Datasets/CXR
  num_workers: 0
  pin_mem: false
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  datasets_to_use:
    - tb_database

logging:
  folder: experiments/cxr_jepa_smoke/
  write_tag: jepa_cxr_vit_small_smoke

mask:
  allow_overlap: false
  aspect_ratio:
    - 0.75
    - 1.5
  enc_mask_scale:
    - 0.85
    - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
    - 0.15
    - 0.2

meta:
  copy_data: false
  load_checkpoint: false
  model_name: vit_small
  pred_depth: 6
  pred_emb_dim: 384
  read_checkpoint: null
  use_bfloat16: false

optimization:
  ema:
    - 0.996
    - 1.0
  epochs: 1
  final_lr: 1.0e-6
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 5.0e-4
  start_lr: 1.0e-4
  warmup: 1
  weight_decay: 0.04
